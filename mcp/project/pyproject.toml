[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatari-mcp"
version = "0.1.0"
description = "MCP server for controlling Hatari and its debugger"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
launcher = [
  "pillow>=10",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
hatari-mcp = "hatari_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
